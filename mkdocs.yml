site_name: OIAF Documentation
site_description: Open Identity Access Firewall
site_url: https://schildkrote.github.io/oiaf/
repo_url: https://github.com/Schildkrote/oiaf
repo_name: Schildkrote/oiaf
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/shield-lock
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - "Comparison: vs commercial vendors": comparison.md
  - Architecture:
    - Overview: architecture/overview.md
    - Control Plane: architecture/control-plane.md
    - Adapters: architecture/adapters.md
    - Policy Engine: architecture/policy-engine.md
    - Risk Engine: architecture/risk-engine.md
    - MFA Orchestration: architecture/mfa-orchestration.md
  - Security:
    - Threat Model: security/threat-model.md
    - Secure Defaults: security/secure-defaults.md
    - Credential Handling: security/credential-handling.md
    - MFA Security: security/mfa-security.md
    - Audit Logging: security/audit-logging.md
  - Adapters:
    - RADIUS: adapters/radius.md
    - LDAP Proxy: adapters/ldap-proxy.md
    - PAM: adapters/pam.md
    - Windows Credential Provider: adapters/windows-credential-provider.md
    - AD Monitor: adapters/ad-monitor.md
    - Okta: adapters/okta.md
    - Entra ID: adapters/entra-id.md
    - Duo: adapters/duo.md
  - Deployment:
    - Quickstart: deployment/quickstart.md
    - Production: deployment/production.md
    - Air-Gapped: deployment/air-gapped.md
  - Operations:
    - Backup & Restore: operations/backup-restore.md
    - Monitoring: operations/monitoring.md
    - Disaster Recovery: operations/disaster-recovery.md
  - Policies:
    - Policy as Code: policies/policy-as-code.md
    - Examples: policies/examples.md
  - Contributing:
    - Getting Started: contributing/getting-started.md
    - Development: contributing/development.md
    - RFC Process: contributing/rfc-process.md
  - RFCs:
    - "0001: DC Agent + Service Account Discovery": rfcs/0001-dc-agent-service-account-discovery.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Schildkrote/oiaf
      name: OIAF on GitHub
