replicaCount: 2

image:
  repository: ghcr.io/schildkrote/oiaf
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

postgresql:
  enabled: true
  auth:
    username: oiaf
    database: oiaf

redis:
  enabled: true
  architecture: standalone

metrics:
  enabled: true

ui:
  enabled: true
