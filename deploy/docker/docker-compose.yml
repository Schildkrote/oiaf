# Local dev stack. Ports bind 127.0.0.1 only.
#
# HONESTY: oiafd currently uses MemoryStore only. Postgres and Redis are started
# for future backends / operator familiarity; core does NOT persist to them yet.
# Do not treat this compose file as "production with durable DB."
services:
  oiaf-core:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OIAF_LISTEN_ADDR=0.0.0.0:8080
      - OIAF_LOG_LEVEL=info
      - OIAF_LOG_FORMAT=json
      - OIAF_ADMIN_TOKEN=${OIAF_ADMIN_TOKEN}
      - OIAF_ADAPTER_TOKEN=${OIAF_ADAPTER_TOKEN}
      # Reserved for a future PostgresStore — ignored by MemoryStore today:
      - OIAF_DATABASE_URL=${OIAF_DATABASE_URL:-}
      - OIAF_REDIS_URL=${OIAF_REDIS_URL:-}
      - OIAF_UI_ENABLED=true
      - OIAF_METRICS_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/oiafctl", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional sidecars for local experiments. Not required for MemoryStore MVP.
  postgres:
    profiles: ["durable-preview"]
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=oiaf
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-oiaf-dev-only}
      - POSTGRES_DB=oiaf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oiaf"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    profiles: ["durable-preview"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
